name: Build Aurorachat

on:
  push:
    branches: [ "main" ]
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/cool-guy-awesome/devkitarm-wine-docker:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Project
        run: |
          make
          make cia

      - name: Upload 3DSX
        uses: actions/upload-artifact@v7
        with:
          name: aurorachat 3DSX Automatic Build (could be unfinished!)
          path: ./aurorachat-3ds.3dsx
        
      - name: Upload CIA 
        uses: actions/upload-artifact@v7
        with:
          name: aurorachat CIA Automatic Build (could be unfinished!)
          path: ./aurorachat.cia
      - name: Setup Java JDK
        uses: actions/setup-java@v5.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 8.0
          name: Discord Notification
      - name: Send Discord Message
        uses: ilshat/discord-message-action@v1.2.1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          title: "New build."
          description: |
            **Repository:** ${{ github.repository }}
            **Commit Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
            click the **latest one** in https://github.com/Unitendo/aurorachat-3ds/actions/workflows/build.yml 
          color: 3066993 
          url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
