name: Build Aurorachat

on:
  push:
    branches: [ "main" ]
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/cool-guy-awesome/devkitarm-wine-docker:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Project
        run: |
          make
          make cia

      - name: Upload 3DSX
        uses: actions/upload-artifact@v7
        with:
          name: aurorachat 3DSX Automatic Build (could be unfinished!)
          path: ./aurorachat-3ds.3dsx
        
      - name: Upload CIA 
        uses: actions/upload-artifact@v7
        with:
          name: aurorachat CIA Automatic Build (could be unfinished!)
          path: ./aurorachat.cia
      - name: Setup Java JDK
        uses: actions/setup-java@v5.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 8.0
      - name: Quick Ping
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "<@&1487250161213374606> New build. Click the top link at https://github.com/Unitendo/aurorachat-3ds/actions/workflows/build.yml . If you dont know how to do this, I will find you."}' \
          ${{ secrets.DISCORD_WEBHOOK }}
